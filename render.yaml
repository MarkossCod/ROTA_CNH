services:
  - type: web
    name: rota-cnh
    runtime: static
    buildCommand: npm ci --include=dev && npm run build:render
    staticPublishPath: ./render-dist
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: SKIP_INSTALL_DEPS
        value: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
